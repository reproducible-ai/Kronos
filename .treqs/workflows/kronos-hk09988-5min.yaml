name: kronos-hk09988-5min reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

# NOTE (hand edit to the generated file): the scaffold puts `--wandb-to-trackio`
# and TRACKIO_SPACE_ID on every run stage. Both are removed here. Kronos ships NO
# wandb, mlflow, trackio or tensorboard integration anywhere in the repository --
# grep over every file finds none -- so the bridge has nothing to forward. It is
# not merely inert either: roar's sitecustomize attempts `import trackio` in every
# traced process, and that attempt alone has been enough to attribute trackio and
# gradio_client into a recorded freeze. The only logging upstream ships is Comet,
# and only in the OTHER pipeline (finetune/train_predictor.py:12, :200 and
# finetune/train_tokenizer.py:15, :238), which trains from Qlib data rather than
# CSV; Comet is not bridged and needs an API key. See the row notes.

secrets:
  - HF_TOKEN            # roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    # P0-7: purge every pre-baked roar first. Deleting only the .dist-info leaves an
    # importable roar/ package dir behind, and a bare /usr/local/bin/roar has been
    # caught importing it. Never pipe a destructive command into head.
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    echo "--- P0-7 verification sweep (must be empty) ---"
    find / -xdev \( -name 'roar_inject.pth' -o -name 'roar-worker' \) -print 2>/dev/null || true
    echo "--- end sweep ---"
    # Build identity. TestPyPI files are immutable, so the published digest of the
    # linux x86_64 wheel IS the build identity recorded for this row.
    python3 -c "
    import json, urllib.request
    d = json.load(urllib.request.urlopen('https://test.pypi.org/pypi/roar-cli/0.4.4rc6/json'))
    w = [u for u in d['urls'] if u['filename'].endswith('manylinux_2_34_x86_64.whl')][0]
    print('WHEEL', w['filename'], w['digests']['sha256'])
    assert w['digests']['sha256'] == 'c7115b748886259b6a089e547404376acf84c3b81b4cbc8dc5610490ebea7199', 'WHEEL DIGEST MISMATCH'
    "
    # P0-20 retired: install the PUBLISHED build from the index -- no presigned URL,
    # no per-target ROAR_WHEEL_URL secret, so no cross-agent contention.
    # --index-strategy unsafe-best-match: uv gives --extra-index-url first-match
    # priority otherwise and never sees the rc.
    # --python 3.12.10 (P0-14) so roar's interpreter == the recorded child's.
    # --with huggingface-hub (P0-19) so `roar put ... hf://` cannot die after the
    # traced steps have already succeeded.
    # `uv` is NOT on PATH on this AMI. Look in the usual per-user bin dirs first,
    # and bootstrap it only if it genuinely is not installed.
    echo "user=$(id -un) home=$HOME"
    command -v uv >/dev/null || export PATH="$HOME/.local/bin:/root/.local/bin:/usr/local/bin:$PATH"
    command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | sh; export PATH="$HOME/.local/bin:$PATH"; }
    uv --version
    uv tool install --python 3.12.10 --force --with huggingface-hub \
      --index-url https://test.pypi.org/simple/ \
      --extra-index-url https://pypi.org/simple/ \
      --index-strategy unsafe-best-match \
      roar-cli==0.4.4rc6
    # P0-17: the treqs agent shells out to a bare `roar` after the run, without this
    # stage's PATH, so the executable has to exist at /usr/local/bin/roar.
    ROAR_BIN="$(command -v roar || true)"
    test -n "$ROAR_BIN" || ROAR_BIN="$HOME/.local/bin/roar"
    test -x "$ROAR_BIN" || ROAR_BIN=/root/.local/bin/roar
    echo "roar installed at $ROAR_BIN"
    sudo ln -sf "$ROAR_BIN" /usr/local/bin/roar
    hash -r
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc6" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    # `env -C` (coreutils >= 8.28) carries the working directory INSIDE the
    # recorded argv. Fail here rather than after the paid steps.
    env -C . true || { echo "env -C unsupported: $(env --version | head -1)"; exit 1; }
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch_pretrained:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n fetch_pretrained -- python repro/fetch_pretrained.py
  trace: off

finetune_tokenizer:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n finetune_tokenizer -- env -C finetune_csv python train_sequential.py --config configs/config_repro_kronos-small_1epoch.yaml --skip-basemodel
  trace: off

finetune_predictor:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    roar run -n finetune_predictor -- env -C finetune_csv python train_sequential.py --config configs/config_repro_kronos-small_1epoch.yaml --skip-tokenizer
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact finetune_csv/finetuned/HK_ali_09988_kline_5min_all/basemodel/best_model/model.safetensors model.name=kronos-hk09988-5min model.version=1 license.id=MIT license.name='MIT License' description='Kronos-small (24.7M) fine-tuned on HK 09988 5-minute K-lines: upstream tokenizer + predictor CSV recipe, 1 epoch per stage' documentation.url=https://github.com/reproducible-ai/Kronos/blob/master/finetune_csv/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put finetune_csv/finetuned/HK_ali_09988_kline_5min_all/basemodel/best_model/model.safetensors hf://reproducible-ai/kronos --public --yes --no-tag -m "Kronos-small fine-tuned on HK 09988 5-min K-lines, TRUNCATED to 1 epoch of tokenizer + 1 epoch of predictor (upstream defaults 30 / 20); not converged"
  trace: off
