# Reproduction config for the Kronos CSV fine-tuning pipeline (finetune_csv/).
#
# Derived verbatim from upstream's own template
# `configs/config_ali09988_candle-5min.yaml`; only the following differ, and each
# difference is deliberate:
#
#   * every path is relative to `finetune_csv/` (the template ships `/xxxx/...`
#     placeholders that cannot run anywhere). `finetune_csv/` is the working
#     directory upstream's own README assumes -- `train_sequential.py` does
#     `sys.path.append('../')` to find the `model` package, which only resolves
#     from there.
#   * pretrained_predictor is Kronos-small (24.7M) rather than Kronos-base (102.3M):
#     Kronos-small is the checkpoint upstream's own README quickstart and
#     tests/test_kronos_regression.py use, it shares the 512-token context of
#     Kronos-Tokenizer-base, and it fits a single 16 GB T4.
#   * tokenizer_epochs 30 -> 1 and basemodel_epochs 20 -> 1: this run is TRUNCATED.
#     The upstream defaults are recorded above each key so the full run is readable
#     from this file.
#   * num_workers 6 -> 0: single-process data loading, so the recorded package set
#     reflects the training process itself.
#   * seed 42 is upstream's template value, unchanged.

data:
  data_path: "data/HK_ali_09988_kline_5min_all.csv"
  lookback_window: 512
  predict_window: 48
  max_context: 512
  clip: 5.0
  # dataset split ratio (upstream template values, unchanged)
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  # TRUNCATED. upstream template: tokenizer_epochs: 30
  tokenizer_epochs: 1
  # TRUNCATED. upstream template: basemodel_epochs: 20
  basemodel_epochs: 1
  batch_size: 32
  log_interval: 50
  # upstream template: 6. Set to 0 so the traced process performs its own imports.
  num_workers: 0
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  # gradient accumulation steps for tokenizer training
  accumulation_steps: 1

# model path configuration (relative to finetune_csv/; populated by repro/fetch_pretrained.py)
model_paths:
  pretrained_tokenizer: "../pretrained/Kronos-Tokenizer-base"
  pretrained_predictor: "../pretrained/Kronos-small"

  exp_name: "HK_ali_09988_kline_5min_all"
  base_path: "finetuned"

  # generated from base_path + exp_name by config_loader.ConfigLoader
  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_custom_finetune"
  description: "Kronos-small fine-tune on HK 09988 5-minute K-lines (truncated to 1 epoch per stage)"
  # upstream reads this key but finetune_csv/ never constructs a logger from it;
  # Comet is wired only into the separate finetune/ (Qlib) pipeline.
  use_comet: false

  train_tokenizer: true
  train_basemodel: true

  skip_existing: false

device:
  use_cuda: true
  device_id: 0
